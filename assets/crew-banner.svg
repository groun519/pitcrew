<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Pit Crew</title>
  <desc id="desc">A racing garage banner showing the Crew Chief, Mechanic, and Inspector roles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="0.58" stop-color="#111823"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5b5b"/>
      <stop offset="1" stop-color="#d63031"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64a8ff"/>
      <stop offset="1" stop-color="#2f6fd6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd66b"/>
      <stop offset="1" stop-color="#d99b21"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>

  <!-- garage lighting -->
  <g opacity="0.45">
    <rect x="715" y="38" width="130" height="12" rx="6" fill="#f4f7fb"/>
    <rect x="866" y="38" width="130" height="12" rx="6" fill="#f4f7fb"/>
    <rect x="1017" y="38" width="130" height="12" rx="6" fill="#f4f7fb"/>
    <path d="M740 50 L690 310" stroke="#dfe7f2" stroke-width="2" opacity="0.22"/>
    <path d="M920 50 L900 310" stroke="#dfe7f2" stroke-width="2" opacity="0.18"/>
    <path d="M1080 50 L1125 310" stroke="#dfe7f2" stroke-width="2" opacity="0.15"/>
  </g>

  <!-- checkered mark -->
  <g transform="translate(58 62)">
    <path d="M0 0h34l-10 34H-10z" fill="#f1f4f8"/>
    <path d="M42 0h34L66 34H32z" fill="#ff4d4f"/>
    <path d="M-14 42h34L10 76h-34z" fill="#ff4d4f"/>
    <path d="M28 42h34L52 76H18z" fill="#f1f4f8"/>
  </g>

  <!-- title block -->
  <text x="58" y="190" fill="#f7f9fc" font-family="Arial, Helvetica, sans-serif" font-size="82" font-style="italic" font-weight="800" letter-spacing="-3">PIT CREW</text>
  <text x="60" y="232" fill="#aab5c4" font-family="Arial, Helvetica, sans-serif" font-size="23">One decides. One builds. One inspects.</text>
  <text x="60" y="286" fill="#e7ecf3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">A bounded multi-model workflow for Codex.</text>
  <text x="60" y="318" fill="#8e9bab" font-family="Arial, Helvetica, sans-serif" font-size="17">High-level judgment stays with the Crew Chief.</text>
  <text x="60" y="345" fill="#8e9bab" font-family="Arial, Helvetica, sans-serif" font-size="17">Implementation and local correction stay in the bay.</text>

  <!-- car nose -->
  <g filter="url(#shadow)">
    <path d="M585 382 C700 325 920 314 1155 365 L1200 520 H500 Z" fill="#171e28" stroke="#2c3746" stroke-width="2"/>
    <path d="M657 390 C780 351 951 350 1118 382 L1072 455 H610 Z" fill="#222c39"/>
    <path d="M756 405 H966" stroke="#5b6878" stroke-width="4" stroke-linecap="round"/>
    <text x="730" y="447" fill="#d8dee8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-style="italic" font-weight="800">PIT CREW / 01</text>
  </g>

  <!-- Crew Chief -->
  <g transform="translate(655 105)" filter="url(#shadow)">
    <circle cx="74" cy="70" r="58" fill="#151b24" stroke="#ff5b5b" stroke-width="3"/>
    <circle cx="74" cy="57" r="22" fill="#d8dee8"/>
    <path d="M33 121 C42 86 57 78 74 78 C92 78 108 87 116 121 Z" fill="#29313d"/>
    <path d="M40 37 Q74 4 108 37" fill="none" stroke="#ff5b5b" stroke-width="8" stroke-linecap="round"/>
    <rect x="4" y="145" width="140" height="34" rx="17" fill="url(#red)"/>
    <text x="74" y="168" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">ASTRA</text>
    <text x="74" y="205" text-anchor="middle" fill="#f0f3f7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Crew Chief</text>
    <text x="74" y="230" text-anchor="middle" fill="#8f9bab" font-family="Arial, Helvetica, sans-serif" font-size="14">decides</text>
  </g>

  <!-- Mechanic -->
  <g transform="translate(835 105)" filter="url(#shadow)">
    <circle cx="74" cy="70" r="58" fill="#151b24" stroke="#64a8ff" stroke-width="3"/>
    <circle cx="74" cy="57" r="22" fill="#d8dee8"/>
    <path d="M33 121 C42 86 57 78 74 78 C92 78 108 87 116 121 Z" fill="#29313d"/>
    <path d="M28 88 L8 112" stroke="#64a8ff" stroke-width="8" stroke-linecap="round"/>
    <path d="M120 30 L144 8" stroke="#64a8ff" stroke-width="8" stroke-linecap="round"/>
    <rect x="4" y="145" width="140" height="34" rx="17" fill="url(#blue)"/>
    <text x="74" y="168" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">LUNA</text>
    <text x="74" y="205" text-anchor="middle" fill="#f0f3f7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Mechanic</text>
    <text x="74" y="230" text-anchor="middle" fill="#8f9bab" font-family="Arial, Helvetica, sans-serif" font-size="14">builds</text>
  </g>

  <!-- Inspector -->
  <g transform="translate(1015 105)" filter="url(#shadow)">
    <circle cx="74" cy="70" r="58" fill="#151b24" stroke="#ffd66b" stroke-width="3"/>
    <circle cx="74" cy="57" r="22" fill="#d8dee8"/>
    <path d="M33 121 C42 86 57 78 74 78 C92 78 108 87 116 121 Z" fill="#29313d"/>
    <circle cx="105" cy="100" r="20" fill="none" stroke="#ffd66b" stroke-width="7"/>
    <path d="M120 115 L140 135" stroke="#ffd66b" stroke-width="7" stroke-linecap="round"/>
    <rect x="4" y="145" width="140" height="34" rx="17" fill="url(#gold)"/>
    <text x="74" y="168" text-anchor="middle" fill="#16191e" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">SOL</text>
    <text x="74" y="205" text-anchor="middle" fill="#f0f3f7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Inspector</text>
    <text x="74" y="230" text-anchor="middle" fill="#8f9bab" font-family="Arial, Helvetica, sans-serif" font-size="14">inspects</text>
  </g>

  <rect x="0" y="500" width="1200" height="20" rx="0" fill="#ff4d4f" opacity="0.9"/>
</svg>
